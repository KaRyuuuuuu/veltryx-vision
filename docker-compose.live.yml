services:
  mediamtx:
    image: bluenviron/mediamtx:1
    network_mode: host
    restart: "no"
    environment:
      MTX_RTSPADDRESS: :8555
      MTX_PATHS_CAM_SOURCE: rtsp://127.0.0.1:8554/h264
      MTX_PATHS_CAM_RTSPTRANSPORT: tcp
      MTX_WEBRTCADDRESS: :8889
      MTX_WEBRTCLOCALUDPADDRESS: :8189
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1
